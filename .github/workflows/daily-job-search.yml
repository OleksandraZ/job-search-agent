name: Daily job search

on:
  schedule:
    # Once a day, nominally ~06:13 Europe/Berlin. GitHub Actions cron is always UTC,
    # so this is pinned to the current CEST offset (UTC+2) and drifts an hour against
    # local wall-clock time across the DST switch (lands at ~05:13 local once CET
    # (UTC+1) kicks back in) - update by hand each side of the switch if exact local
    # times matter more than the drift. Offset off the exact hour on purpose: GitHub's
    # own docs warn that top-of-the-hour is the highest-load slot for the schedule
    # event and runs there can be delayed for hours or dropped entirely - a round-hour
    # cron here missed a whole day (2026-09-21). Even off the hour, scheduled runs
    # actually started ~4-6h late (11:13 UTC slot started 15:00-17:20 UTC every day
    # 2026-09-25..10-04, GitHub API run_started_at) - hence the early slot, so results
    # still land in the morning. History: 11:13+17:17 UTC until 2026-10-05, then
    # 08:13+14:17, then (2026-10-06, user decision) a single run 4h earlier.
    - cron: "13 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-job-search
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: Run QA keyword search
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      # Only the QA search runs on schedule (user decision 2026-10-06). The Python,
      # Cloud/DevOps and Data Engineering keyword files are run locally on demand:
      # python main.py --keywords keywords_python.yaml (or tools/market_report.py).
      # The run above mutates state on disk that has to survive to tomorrow's
      # run: storage/jobs.db (dedupe - without this every job would look "new"
      # again every day) and config/companies.yaml (resolve_pending() fills in
      # any freshly-added company's `ats` field in place). Commit whatever
      # changed back to the repo so the next scheduled run picks it up.
      - name: Persist dedupe DB and resolved companies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storage/jobs.db config/companies.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: update dedupe DB and resolved companies [skip ci]"
          # main may have moved while this run was going (a run takes up to an hour
          # and often starts hours late) - a plain push was rejected that way on
          # 2026-10-06. Rebase onto it first; if both sides changed the binary
          # jobs.db, keep this run's copy (-X theirs = the commit being replayed),
          # since it is the freshest dedupe state.
          git pull --rebase -X theirs origin main
          git push
