meta:
  usage: 'title_match_terms: case-insensitive match against job TITLE (broad net) and used
    as the search query sent to every board.

    report_label: names this search in the Telegram report heading ("New {label} jobs")
    and the no-jobs fallback message, so runs against different keyword files are
    distinguishable in chat history - see main.py:main() and notifier/telegram.py.

    Revised 2026-10-05 against the target query ("QA Engineer" OR "Test Automation" OR
    "QA Automation" OR SDET OR "Quality Engineer" OR Testautomatisierer OR
    Softwaretester) AND (Python OR Playwright OR "API testing" OR Locust), seniority
    mid-level. Added terms close real word-boundary gaps: "Quality Assurance Engineer"
    (neither "QA Engineer" nor "Software Quality Assurance Engineer" matches it),
    spelled-out "Software Development Engineer in Test" ("Software Engineer in Test"
    does not match it), bare "Test Automation"/"QA Automation"/"Testautomatisierung"
    (catch Specialist/Developer/"Ingenieur Testautomatisierung" variants), and
    "Qualitätssicherung" - broad on its own (manufacturing/pharma QA), usable only
    because require_term_groups drops anything without a matching skill. Older,
    now-redundant specific terms (e.g. "Backend QA Engineer" inside "QA Engineer")
    are kept on purpose: each is also a separate board search, and a narrower query
    can surface results a broad one loses to a board''s page/size cap.

    title_exclude_terms: drops student/apprenticeship, above-mid and manager titles.
    "Junior" is deliberately NOT excluded (only not targeted). German compounds need
    their own entry since word-boundary matching does not see inside them
    ("Testmanager", "Teamleiter").

    require_term_groups: title OR description must mention one skill; empty
    descriptions are kept (pipeline/filters.py:require_term_groups). "API testing" is
    listed with its common spelling variants, since word-boundary matching treats
    "API testing" and "API-Testing" as different strings. This drops QA roles that
    only mention e.g. Java/Selenium or Cypress - intended by the target query.

    description_exclude_terms (2026-10-06, user-curated from real noisy postings):
    a job is dropped if its title or description mentions any of these domains
    (robotics/mechatronics, embedded/HIL, environmental/mechanical testing, optics,
    PLC/SIMATIC, automotive functional safety, radio/radar, space AIT, defense
    simulation, aerospace/aviation - added after a Blackwave "Quality Engineer
    Aerospace" posting got through), RHEL/Rocky Linux, network-protocol
    tooling (Wireshark/OpenSSL), mobile QA, native/C2 German requirements,
    usability/accessibility testing. Plain terms, word-boundary matched. The last entry is a conditional
    rule (user decision 2026-10-06): any other programming language, test
    framework/tool, or Azure only drops a job that mentions neither Python nor
    Playwright ("Playwright and Cypress" stays, "Selenium with Java" goes).
    TypeScript/JavaScript deliberately not listed (Playwright''s own languages);
    "Go" only as "Golang" (bare "Go" matches "go-live"); app frameworks
    (Angular/React) not listed - in QA ads they describe the product under test. See pipeline/filters.py:exclude_by_description().'
  counts:
    title_match_terms: 26
    title_exclude_terms: 27
    require_term_groups: 1
    description_exclude_terms: 117
