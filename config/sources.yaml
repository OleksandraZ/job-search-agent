meta:
  source_of_this_list: germany_job_boards_qa_sdet.json (user-supplied research)
  total_platforms: 118
  enabled_count: 118
  priority_legend:
    '1': Most relevant — monitor continuously and create alerts
    '2': Highly relevant — check several times per week
    '3': Useful secondary source — check weekly
    '4': Low-yield, duplicate-heavy, regional or niche — check occasionally
  note: All 118 sources enabled per user request. Priority field retained for triage/build-order purposes,
    not for filtering.
  adapter_legend:
    arbeitnow_api: Real, working adapter (adapters/boards/arbeitnow_api.py). Built and verified.
    html_scrape: Real, working adapter (adapters/boards/html_scrape.py). Currently only used by
      germantechjobs_testing_germany, via its RSS feed - despite the generic-sounding name, this
      module is not (yet) a generic scraper; see CLAUDE.md.
    stepstone: Real, working adapter (adapters/boards/stepstone.py). Built and verified.
    devjobs: Real, working adapter (adapters/boards/devjobs.py). Built and verified.
    testdevjobs: Real, working adapter (adapters/boards/testdevjobs.py). Built and verified.
    wearedevelopers: Real, working adapter (adapters/boards/wearedevelopers.py). Built and verified.
    englishjobsde: Real, working adapter (adapters/boards/englishjobsde.py). Built and verified.
    builtin: Real, working adapter (adapters/boards/builtin.py). Built and verified.
    xing_jobs: Real, working adapter (adapters/boards/xing_jobs.py). Built and verified.
    get_in_it: Real, working adapter (adapters/boards/get_in_it.py). Built and verified.
    instaffo: Real, working adapter (adapters/boards/instaffo.py). Built and verified.
    bundesagentur: Real, working adapter (adapters/boards/bundesagentur.py). Built and verified.
    json_api_todo: Automated classification pass (2026-08-17) found a real JSON API response at
      this URL. No adapter built yet - see the add-board-source skill.
    html_scrape_todo: Automated pass found real server-rendered HTML with visible job-search
      content (not a bare SPA shell). No adapter built yet - likely scrapeable with BeautifulSoup,
      but re-verify per add-board-source skill step 1 before building, since the check was a page
      fetch only (no pagination/search-flow/login-wall verification).
    js_rendered_todo: Automated pass found a client-rendered SPA shell (little/no visible text
      despite substantial HTML/JS payload). Needs the same investigation as GermanTechJobs did -
      check for a real API behind the site's own search, or an RSS/feed alternative, before
      reaching for a browser-automation dependency.
    anti_bot_avoid: Blocked (HTTP 401/403/429/999) during the automated pass, or known to be
      heavily anti-scraping regardless of what an unauthenticated request returns (linkedin_jobs -
      its plain GET returns only cookie-consent boilerplate, not real listings; per job_search_agent_plan.md
      §4 Tier 3, use an alternate channel like an email job alert instead of direct scraping).
    broken_todo: URL was unreachable (DNS failure, connection/read timeout) during the automated
      pass. May be a dead/renamed domain, or a transient network issue - re-check before assuming
      the source is gone.
    ambiguous_todo: Automated pass couldn't confidently classify this one (e.g. empty response
      with no clear SPA/anti-bot signal). Needs manual investigation (add-board-source skill step 1)
      before building.
sources:
- id: linkedin_jobs
  name: LinkedIn Jobs
  url: https://www.linkedin.com/jobs/
  priority: 1
  category: general
  enabled: true
  adapter: anti_bot_avoid
  notes: Highest overall volume for German QA/SDET roles, international employers, recruiter outreach,
    and granular alerts.
- id: stepstone_germany
  name: StepStone Germany
  url: https://www.stepstone.de/
  priority: 1
  category: general
  enabled: true
  adapter: stepstone
  notes: Major source for permanent mid-level and senior QA roles at established German employers.
    Real server-rendered HTML (data-testid="job-item" cards), queried once per
    title_match_terms entry via /jobs/<term-slug> (spaces -> hyphens, URL-quoted -
    verified against multi-word and umlaut terms). Listing cards carry a real but
    short (~300 char, often mid-sentence-truncated) description snippet; for
    title-matched jobs the adapter additionally fetches the job's detail page
    (the "-inline.html" URL from the listing card) for the full description -
    that fetch requires a Referer header or the connection gets reset
    (HTTP/2 INTERNAL_ERROR) by StepStone's bot detection, no other anti-bot
    friction observed. location is StepStone's own structured city field (can be
    multi-city for postings open to several offices).
- id: indeed_germany
  name: Indeed Germany
  url: https://de.indeed.com/
  priority: 1
  category: general
  enabled: true
  adapter: anti_bot_avoid
  notes: Broad aggregator covering employer career pages, agencies, and both English- and German-language
    QA vacancies.
- id: devjobs_germany_qa_engineer
  name: DEVjobs Germany – QA Engineer
  url: https://en.devjobs.de/jobs/qa-engineer
  priority: 1
  category: tech
  enabled: true
  adapter: devjobs
  notes: Tech-specific QA search with stack, salary, English-only, seniority, and work-model filters.
    Real server-rendered HTML, but requires a browser User-Agent header (default
    httpx UA gets a 403). No free-text search - /jobs/search only accepts
    jobProfessions from a small fixed taxonomy (every title_match_terms entry was
    tested as a slug; only "qa-engineer" and "test-automation-engineer" are real
    categories), so the adapter crawls those two paginated categories in full and
    relies on filter_by_title downstream, same approach as GermanTechJobs' RSS.
    Listing cards carry a short real snippet; title-matched jobs get a full
    description from the detail page's job-body div. Auto-translates German-origin
    postings to English, which surfaced a real gap in
    config/language_rules.yaml's German-requirement/disclaimer patterns - fixed
    there (see job_search_agent_phase5 memory), not just here.
- id: germantechjobs_testing_germany
  name: GermanTechJobs – Testing Germany
  url: https://germantechjobs.de/en/jobs/Tester/all
  rss_url: https://germantechjobs.de/rss
  priority: 1
  category: tech
  enabled: true
  adapter: html_scrape
  notes: German tech board with transparent stacks and frequent salary ranges; highly relevant to automation
    roles. The Tester/all page is a client-rendered React app with no data in the raw HTML, so the
    adapter reads the site's RSS feed instead (unfiltered by category — narrowed by title_match_terms).
- id: testdevjobs_remote_germany
  name: TestDevJobs – Remote Germany
  url: https://testdevjobs.com/location/remote-germany/
  path: /location/remote-germany/
  priority: 1
  category: qa-specialist
  enabled: true
  adapter: testdevjobs
  notes: Testing-specific board covering QA, SDET, Playwright, pytest, API and automation vacancies available
    in Germany. Real server-rendered HTML, no anti-bot friction, no special headers
    needed. No free-text search - this is a fixed, pre-filtered listing page
    (the `path` field, paginated) rather than a query endpoint - despite the "remote"
    in the URL it actually lists both Fully Remote and On-Site Germany postings,
    distinguished by a real structured work-mode badge on each card, folded into
    NormalizedJob.location (not description) since it's source-provided structured
    data, same trust level as Arbeitnow's "Fully Remote" location values.
- id: wearedevelopers_jobs
  name: WeAreDevelopers Jobs
  url: https://www.wearedevelopers.com/en/jobs
  priority: 1
  category: tech
  enabled: true
  adapter: wearedevelopers
  notes: Strong European developer board with active German software-testing and automation roles.
    A large multi-source aggregator (Adzuna/Indeed/Xing/etc. under the hood), but
    every page is also published as clean Markdown purpose-built for machine
    consumption (append ".md" to any URL - see /agents.md) - no HTML parsing needed.
    /jobs.md?country=DE&q=<term> is a real working keyword search, queried once per
    title_match_terms entry (page 1/~25 results only - some terms alone return 200+
    results, breadth across 23 terms plus filter_by_title downstream covers it
    without deep pagination). Real structured location field (city or
    "Germany (Remote available)"). Detail pages are plain markdown, not HTML, so
    there's no <li>/<ul> structure for classify_language.py's HTML-tag clause
    boundary to key off - "." and ";" alone still bound each clause there.
- id: arbeitnow_qa_jobs
  name: Arbeitnow – QA Jobs
  url: https://www.arbeitnow.com/jobs/qa
  priority: 1
  category: english-international
  enabled: true
  adapter: arbeitnow_api
  notes: English-friendly Germany board with remote, relocation, visa and salary filters and a direct
    QA search. The documented job-board-api has no working search/tags filter and only returns the
    newest ~175 postings, so the adapter uses the site's internal search endpoint (/api/jobs) instead,
    queried once per title_match_terms entry (injected by agents/munich_local.py).
- id: englishjobsde
  name: EnglishJobs.de
  url: https://englishjobs.de/
  priority: 1
  category: english-international
  enabled: true
  adapter: englishjobsde
  notes: Dedicated search engine for positions in Germany where German is not required.
    Despite the site's own positioning, real search results do include jobs stating
    a German requirement (e.g. "Requires ... fluency in German and English") - don't
    skip the language classifier for this source. Real server-rendered HTML
    (talent.com-powered, /jobs/<term_with_underscores> search, one query per
    title_match_terms entry, page 1/~20 results only). It's a clickout-tracked
    aggregator - "View job" redirects to whatever arbitrary external site actually
    posted it, with no consistent structure to fetch a fuller description from, so
    the adapter uses the real (not placeholder) ~250-750 char excerpt already in the
    search-result snippet rather than attempting a detail-page fetch, same approach
    as GermanTechJobs' RSS. Fixed a title-extraction bug where BeautifulSoup's
    get_text(strip=True)/get_text(" ", strip=True) both corrupted titles containing
    <em>-highlighted search terms (e.g. "QA/QC" became "QAQC" or "QA /QC") - see
    job_search_agent_phase5 memory.
- id: built_in_qa_germany
  name: Built In – QA Germany
  url: https://builtin.com/jobs/eu/germany/dev-engineering/search/qa
  priority: 1
  category: tech
  enabled: true
  adapter: builtin
  notes: Current international tech listings with useful stack descriptions, including Playwright, API
    and backend QA. Real server-rendered HTML, no anti-bot friction. No working
    free-text search - every title_match_terms entry was tested as both a
    "/search/<slug>" path and a "?q=" query param; "/search/qa" (this URL) is the
    only real, populated category, other slugs fall back to an unrelated generic
    listing or return 0, and "?q=" is silently ignored (identical results with or
    without it). So the adapter crawls this one category in full (paginated, ~100
    jobs) and relies on filter_by_title downstream, same approach as
    GermanTechJobs' RSS. Real structured location + work-mode field ("Hybrid" /
    "In-Office" / "In-Office or Remote" / etc., sometimes "N Locations" instead of a
    city for multi-site postings) folded together into NormalizedJob.location.
    Title-matched jobs get a full description from the detail page's
    div.job-post-item.
- id: xing_jobs
  name: XING Jobs
  url: https://www.xing.com/jobs
  priority: 1
  category: general
  enabled: true
  adapter: xing_jobs
  notes: Real server-rendered HTML at /jobs/search?keywords=<term> - confirmed real
    free-text search (results diff per term, unlike the devjobs/testdevjobs/builtin
    fixed-taxonomy trap). Structured multi-city location field (cleaned of a "+ N
    weitere" overflow suffix). Cards mostly link to XING's own /jobs/<slug>-<id>
    detail page (full description via [data-testid=expandable-content]); a minority
    ("Externes Job-Angebot") link straight to a partner site instead and are left
    with description="". robots.txt disallows /jobs/search for generic crawlers but
    has an explicit allow block for named AI-agent bots (ClaudeBot, Claude-User,
    GPTBot, PerplexityBot, ...) - user approved (2026-08-18) identifying honestly as
    Claude-User to fall under that grant rather than spoofing a browser UA against a
    path disallowed for anonymous scrapers; see adapters/boards/xing_jobs.py's
    HEADERS comment.
- id: get_in_it
  name: get in IT
  url: https://www.get-in-it.de/jobsuche?thematicPriority=24
  priority: 1
  category: tech
  enabled: true
  adapter: get_in_it
  notes: Next.js site with real structured job data embedded server-side in a
    __NEXT_DATA__ JSON script tag (no HTML-selector scraping needed). No free-text
    search - the filter schema has no keyword field at all, and a ?keywords=/?q=
    query param is silently ignored (parsed into the Next.js route but never reaches
    the job list). Real filtering uses the `thematicPriority` facet instead; id 24 is
    "Quality Assurance" (~100 real QA-tagged jobs out of ~3610 total). Pagination past
    the first ~39 is client-side only (a "load more" button, no URL param changes the
    SSR result) - accepted as a partial-coverage limitation, same tradeoff class as
    other single-listing-page sources. Full description comes from each title-matched
    job's detail page, also via __NEXT_DATA__ (job.content, raw HTML). Deliberately
    does NOT fold the listing's homeOffice boolean into location as a remote signal -
    a real homeOffice=true posting turned out to mean occasional/negotiable home
    office, not full remote (same "sounds remote but isn't" trap as TestDevJobs'
    "remote-first"). Structured location has real addressCountry=DE in its JSON-LD -
    Germany-only, unlike XING's DACH-wide scope, so no country filter needed here.
- id: instaffo_qa_engineer
  name: Instaffo – QA Engineer
  url: https://jobs.instaffo.com/en/browsejobs/qa-engineer
  priority: 1
  category: tech
  enabled: true
  adapter: instaffo
  notes: The /en/browsejobs/qa-engineer listing page is a pure client-rendered SPA
    (no embedded job data at all) and robots.txt disallows /api/ for every crawler
    with no named-bot exception (unlike XING) - so the internal listing API isn't an
    option. Individual job detail pages ARE server-rendered with a real schema.org
    JobPosting JSON-LD block (title/company/jobLocation/description all structured).
    The adapter crawls the sitewide /sitemap-jobs.xml instead (not disallowed,
    ~1958 unique jobs across all categories, no per-category sitemap exists),
    pre-filters using each URL's slug (rough title text, umlaut-normalized) against
    title_match_terms with the same substring check filter_by_title applies
    downstream, and only fetches the handful of detail pages that survive.
- id: bundesagentur_für_arbeit_jobsuche
  name: Bundesagentur für Arbeit Jobsuche
  url: https://www.arbeitsagentur.de/jobsuche/
  priority: 1
  category: official
  enabled: true
  adapter: bundesagentur
  notes: The jobsuche/ listing page itself is a client-rendered Angular app, but it
    uses an official, documented public API (https://jobsuche.api.bund.dev/) for
    search - real free-text search via ?was=<term>, confirmed the frontend's own
    bundled config.js points at /pc/v6/jobs (not v4, which the docs/older examples
    reference) with the well-known public API key "jobboerse-jobsuche" (also the
    OIDC client id in that same config.js - not a secret). The API's own dedicated
    job-detail endpoint (/pc/v4/jobdetails) 404s on every real reference number
    tried, so descriptions are fetched from the human-facing
    /jobsuche/jobdetail/<referenznummer> page instead, which is server-rendered with
    a real schema.org JobPosting JSON-LD block (works the same for both normal and
    "Chiffre"/anonymized-employer listings). Not exclusively Germany - a small
    fraction of real results were Luxembourg/Romania-based - so, like XING, jobs
    with no German-located stellenlokation are dropped (cheaper here since the
    country is already in the search API's own response, no detail-page fetch
    needed to check).
